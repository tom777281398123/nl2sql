version: 1
description: 固定 dw 种子数据上的端到端 NL2SQL 结果黄金集。
_column_aliases:
  sales: &sales_aliases [total_sales_amount, total_sales, order_amount, gmv, GMV, 销售额, 总销售额, 订单总额, 成交总额]
  count: &count_aliases [order_total_count, total_order_count, total_orders, 订单数, 订单数量]
  quantity: &quantity_aliases [total_order_quantity, total_quantity, sales_quantity, 销量, 总销量]
  average: &average_aliases [average_order_amount, avg_amount, aov, AOV, 平均订单金额, 平均销售额]
  month: &month_aliases [月份]
  region: &region_aliases [region, 地区, 区域, 大区]
  province: &province_aliases [省份]
  gender: &gender_aliases [性别]
  member_level: &member_level_aliases [会员等级, 用户等级]
  category: &category_aliases [商品类别, 品类, 分类]
  brand: &brand_aliases [品牌, 品牌名称]
  product: &product_aliases [商品名称, 产品名称]
  customer: &customer_aliases [客户名称, 用户名称]
  date: &date_aliases [日期, 下单日期]
cases:
  - id: g001_total_sales
    category: aggregate
    difficulty: easy
    query: 查询订单总销售额
    expected_rows:
      - sales_amount: 279159.5
    column_aliases:
      sales_amount: [total_sales_amount]

  - id: g002_sales_by_region
    category: grouping
    difficulty: medium
    query: 统计2025年各地区的销售额，按销售额从高到低排序
    ordered: true
    column_aliases:
      region_name: [地区]
      sales_amount: [销售额]
    expected_rows:
      - region_name: 华东
        sales_amount: 107373.0
      - region_name: 华南
        sales_amount: 70202.0
