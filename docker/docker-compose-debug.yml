  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: storekeeper-qdrant
    restart: unless-stopped
    profiles: ['middleware']
    env_file: *env_file
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - storekeeper

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    container_name: storekeeper-embedding
    restart: unless-stopped
    profiles: ['middleware']
    env_file: *env_file
    ports:
      - "8081:80"
    environment:
      MODEL_ID: BAAI/bge-large-zh-v1.5
      MAX_CONCURRENT_REQUESTS: "16"
      MAX_BATCH_TOKENS: "16384"
    volumes:
      - ./data/embedding:/data
    networks:
      - storekeeper

networks:
  storekeeper:
    name: storekeeper-nl2sql
