name: storekeeper-nl2sql
#name: coze-studio-debug

x-env-file: &env_file
  - .env.debug

services:
  mysql:
    image: mysql:8.0
    container_name: storekeeper-mysql
    restart: unless-stopped
    profiles: ['middleware']
    env_file: *env_file
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ../scripts/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - storekeeper

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.10
    container_name: storekeeper-elasticsearch
    restart: unless-stopped
    profiles: ['middleware']
    env_file: *env_file
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    command: >
      bash -c '
        if [ ! -d /usr/share/elasticsearch/plugins/analysis-ik ]; then
          elasticsearch-plugin install --batch https://get.infini.cloud/elasticsearch/analysis-ik/8.19.10;
        fi;
        exec /usr/local/bin/docker-entrypoint.sh eswrapper
      '
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    networks:
      - storekeeper
